version: 1
stage: storyboard
consumerRunners:
  - manual_submit
  - direct_llm
  - acp_agent

inputs:
  - id: design_prompts
    fromStage: design
    artifactKey: design_prompts
    delivery: handoff_first
    fallback: summary
    required: true

  - id: design_master
    fromStage: design
    artifactKey: master_reference_prompt
    delivery: handoff_first
    fallback: full
    required: true

  - id: design_characters
    fromStage: design
    artifactKey: character_prompts
    delivery: handoff_first
    fallback: full
    required: true

  - id: design_scenes
    fromStage: design
    artifactKey: scene_prompts
    delivery: handoff_first
    fallback: summary
    required: true

  - id: script_draft
    fromStage: script
    artifactKey: script_draft
    delivery: handoff_first
    fallback: full
    required: false

  - id: performance_sheet
    fromStage: performance
    artifactKey: performance_direction
    delivery: full
    required: true

optionalInputs:
  - id: story_direction
    fromStage: story
    artifactKey: story_direction
    delivery: summary
    maxChars: 8000

assetLibrary:
  allowStyleProfile: true
  allowedAssetIds:
    - cinematic.shot_language
    - storyboard.methodology_index

forbidden: []

runnerOverrides: {}
